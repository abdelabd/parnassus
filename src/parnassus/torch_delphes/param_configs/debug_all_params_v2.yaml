# Joint-fit config v2 — RECOVERABLE inits (mild perturbations off truth).
#
# Base = cms_target_default.yaml (the pseudodata truth). Unlike debug_all_params.yaml
# (which perturbs params 3-37x off truth, into saturated/degenerate regions), every
# trainable param here starts within a MILD, recoverable offset of truth.
#
# Two structural changes vs debug_all_params.yaml:
#  1. ECal.resolution_func.barrel_a is PINNED at 1.0 (trainable: false). The ECal
#     barrel/endcap sigma has an EXACT degeneracy: scaling (barrel_a,barrel_b,endcap_a,
#     endcap_b) by k and (common_c_E,c_S,c_N) by 1/k leaves sigma(E,eta) identical, so
#     the 7 params have only 6 observable DOF. Pinning barrel_a=1.0 (the standard Delphes
#     normalization) breaks the flat direction and makes the rest individually identifiable.
#  2. forward_c_E starts < 0.4 (out of the saturated flat landscape), and the sigma-sum
#     magnitude (barrel/endcap prefactors, common_c_N) starts near truth so there is no
#     global "broaden-sigma" pressure that drags the weak c_E terms the wrong way.
#
# Recommended run (constant lr, no early-stop, so the slow resolution params get the full
# n_steps -- both default-ON knobs otherwise truncate the fit on the noisy SW loss):
#   python -m parnassus.torch_delphes.tune_cms_fullsim \
#     --root-file /global/cfs/cdirs/m3246/Runze/MCGen/data/cms_pseudodata_100k.root \
#     --n-events -1 --n-steps 200 --lr 1e-2 \
#     --lr-scheduler-patience 0 --early-stopping-patience 0 \
#     --param-config src/parnassus/torch_delphes/param_configs/debug_all_params_v2.yaml \
#     --history-path doc/fit_results/all_v2.json
#
# Dead params pinned at truth (no recoverable gradient): Electron/Muon eff_logits[2],[5];
# Muon rate_raw[0],[1]; HadronFractions k0s_logit, lambda_logit, photon_logit, k0l_logit.

