# Optuna config for the charged-hadron tracking-efficiency CLOSURE test.
#
# Target: pseudodata generated with param_config_chadtrkeff.yaml (only the four
# ChargedHadronTrackingEfficiency.eff_logits[0..3] differ from the card
# defaults). Same format as optuna_config.yaml (see its header); here
#   - `search`     : identical study knobs / lr ranges to optuna_config.yaml;
#   - `constants`  : empty -- nothing is TPE-sampled;
#   - `parameters` : the trainable mask fits ONLY the four perturbed
#                    efficiencies; every other scalar is pinned at its card
#                    default, which is exactly the generation truth.
# Run (delphes mode: no acceptance cuts, no photon merger):
#   python -m parnassus.torch_delphes.tune_cms_fullsim.optuna_search \
#     --root-file /global/cfs/cdirs/m3246/diff_delphes/pseudo_data_100k_param_config_chadtrkeff.root \
#     --optuna-config src/parnassus/torch_delphes/param_configs/optuna_config_chadtrkeff.yaml \
#     --n-events 100000 --n-steps 100 --n-trials 1 --loss wasserstein_1d --mode delphes \
#     --output-base doc/figure_pseudodata --history-path doc/figure_pseudodata/all_optuna.json

search:
  n_trials: 40
  seed: 0
  global_batch_size: 2048
  lr:
    resolution: {low: 1.0e-4, high: 6.0e-3, log: true, init: 4.9e-3}
    scale:      {low: 3.0e-4, high: 6.0e-3, log: true, init: 1.9e-3}
    efficiency: {low: 1.0e-3, high: 2.0e-2, log: true, init: 1.5e-2}
  # Required by the loader; ignored (merger OFF) in --mode delphes.
  photon_merge_radius: {low: 0.0, high: 0.1, init: 0.045}

constants: {}

# Trainable mask: only the four perturbed charged-hadron efficiencies are fitted.
parameters:
  ChargedHadronTrackingEfficiency.eff_logits[0]:
    trainable: true
  ChargedHadronTrackingEfficiency.eff_logits[1]:
    trainable: true
  ChargedHadronTrackingEfficiency.eff_logits[2]:
    trainable: true
