# Optuna search config for tune_cms_fullsim.optuna_search.
#
# FORMAT (different from the value/trainable/lr_scale per-scalar configs read by
# param_config.load_param_config). Two top-level sections:
#
#   search:     study knobs + the search space for the three per-group Adam
#               learning rates and the photon merge radius.
#   constants:  a SUBSET of the card's scalars, each frozen at a per-trial
#               CONSTANT (trainable: false) -- either
#                 {value: v}                 -> pinned, identical every trial, or
#                 {low, high, log, init}     -> TPE picks one constant per trial
#                                               ('init' is what the seed trial runs).
#               Every scalar NOT listed here is FITTED by Adam, starting from its
#               card constructor default (== the CMS card).
#
# WHY THE FRACTIONS ARE CONSTANTS. R2 verdict (2026-08-12): with a gradient-fitted
# photon leak the optimizer shut it off (f 0.98 -> 0.9994), and that was
# structurally predetermined -- the soft-count gate reads a DETACHED energy
# (SimpleCalorimeter.py), so fraction parameters get NO count-term gradient, while
# sqrt_fraction mutes the NH shape terms that carry the (1-f) benefit. The study,
# by contrast, is scored on the val-loss VALUE, count terms included, so it sees
# exactly what Adam is blind to. The fractions are therefore treated like the merge
# radius: per-trial constants, judged at the study level.
#
# WHY THERE IS NO GLOBAL lr. Adam only ever sees global_lr * lr_scale
# (select_trainable), so the two were exactly degenerate -- a whole redundant
# search dimension. The groups' ABSOLUTE learning rates are searched instead, and
# a materialized config carries them in its lr_scale field with global_lr = 1.
#
# RANGE GUARDS (param_config.to_raw raises if violated):
#   - fractions/efficiencies must be inside their physical window (k0s 0.1-0.5,
#     photon 0.8-1.0, k0l 0-0.4, plain logits 0-1). Constants MAY sit on a
#     boundary; the (0.005, 0.995) trainable-logit guard applies only to fitted
#     params, which never appear here.
#   - chad_logit may not span (1e-4, 5e-3): there the ECal rescale path is on but
#     the tower is always sub-threshold, which imprints ~2-3 GeV pT spikes.
#
# Run:
#   python -m parnassus.torch_delphes.tune_cms_fullsim.optuna_search \
#     --root-file /global/cfs/cdirs/m3246/Runze/MCGen/data/train_1000.root \
#     --n-events 100000 --n-steps 200 \
#     --optuna-config src/parnassus/torch_delphes/param_configs/optuna_config.yaml \
#     --loss wasserstein_1d --pid-weighting sqrt_fraction \
#     --output-base doc/fit_results --history-path doc/fit_results/all_v2.json

search:
  n_trials: 40              # overridable with --n-trials; the seed trial counts
  seed: 0                   # TPE sampler seed (reproducible study)
  # GLOBAL batch (summed over ranks); each rank takes global // world_size. Adam
  # steps once per global batch, so this fixes the number of updates per epoch and
  # makes a study reproducible across GPU counts -- read as PER-RANK it silently
  # became 8192 on 4 GPUs (9 updates/epoch vs 137), which cost the mee restructure
  # round 0.27 -> 0.43 with TPE pinned against the lr ceilings compensating.
  # 2048 trades updates for throughput: 35 updates/epoch at 100k events (vs 137 at
  # 512), but 4x fewer all-reduces and 512/rank on 4 GPUs instead of a
  # cache-inefficient 128. The lr ranges below are scaled to match.
  global_batch_size: 2048
  # ABSOLUTE Adam learning rate per parameter group. Base ranges came from the
  # 10-trial default-start scan (doc/.../..._defaultstart) read in effective
  # (lr * lr_scale) units, at a global batch of ~512:
  #   efficiency  clean signal -- top trials 1.3e-3 .. 7.6e-3; <5e-4 stalled and
  #               1.5e-2 blew the loss up to 23.
  #   scale       weak signal, top trials 3.0e-4 .. 2.9e-3.
  #   resolution  no val-loss signal (top and bottom overlap); bounded because a
  #               fast resolution group drove the post-best NH slide in the
  #               photon-merger round.
  # SCALED x2 for the 512 -> 2048 global batch: Adam noise falls as sqrt(batch),
  # so the sqrt rule (x4 batch -> x2 lr) applies, NOT the linear SGD rule.
  #
  # `init` is REQUIRED and is what the seed trial runs -- the x2 image of the
  # best mee run's effective lrs (res 2.45e-3 / scale 9.4e-4 / eff 7.6e-3 at
  # batch 512). Trial 0 is therefore fully pinned: known-good optimizer on the
  # believed-truth card. Without it trial 0 drew random lrs and ranked 11th of 18.
  #
  # The FLOORS are deliberately per-group, set by how much each group's low end
  # is actually known:
  #   resolution  1e-4: no val-loss signal at all, and a top-5 defaultstart trial
  #               ran an effective 8.9e-5 @512 (~1.8e-4 here) -- explore freely.
  #   scale       3e-4: weak signal; the good band bottoms out at 6e-4 here and
  #               nothing is known below it, so allow one octave of headroom.
  #   efficiency  1e-3: the one CLEAN signal, and it says stop -- every trial
  #               below 5e-4 @512 (= 1e-3 here) stalled into the bottom five.
  # The CEILINGS are scaled failure landmarks, not guesses: 2e-2 is the x2 image
  # of the 1.5e-2 that blew the loss up to val 23, and 6e-3 the x2 image of the
  # resolution cap the post-best NH slide argued for.
  #
  # NOTE the source trials sampled their inits and ran with lr decay ON; here
  # every fit starts from the CMS defaults with decay OFF. Re-read the
  # importances after the first study and retune if a bound is being hit.
  lr:
    resolution: {low: 1.0e-4, high: 6.0e-3, log: true, init: 4.9e-3}
    scale:      {low: 3.0e-4, high: 6.0e-3, log: true, init: 1.9e-3}
    efficiency: {low: 1.0e-3, high: 2.0e-2, log: true, init: 1.5e-2}
  # PhotonClusterMerger seed-cone radius, sampled continuously. The R -> 0 limit
  # IS the merger off (an isolated photon is a cluster of one and passes through
  # bit-identical), so no off-sentinel is needed. init = the 0.045 calibrated
  # against CMS PF counts, so the seed trial is the validated baseline.
  # Unlike the acceptance cuts, best-val losses ARE comparable across radii (the
  # target side is untouched). R is deliberately a per-trial constant, not a
  # gradient-fitted param: each trial's physics converges self-consistently at
  # its R (design doc section 6, M3).
  photon_merge_radius: {low: 0.0, high: 0.1, init: 0.045}

constants:
  # ---- pinned ----
  # chad: all charged-hadron energy to HCal, the CMS-card truth. Its 0.0 is below
  # the 1e-4 SimpleCalorimeter bypass cutoff, so the ECal path stays off (C++
  # parity: the card's 0.0 routes chad tracks straight to EFlowTrack).
  HadronFractions.chad_logit:   {value: 0.0}
  # lambda: dead in these samples (the dijet/mee truth carries no PDG 3122), so
  # searching it would burn a dimension on a parameter the loss cannot see.
  HadronFractions.lambda_logit: {value: 0.3}
  # k0l: pinned this round. It moves the same photon<->NH balance as photon_logit
  # and the merge radius; three correlated dimensions is more than 40 trials can
  # resolve. Unpin once the (photon, R) pair is understood.
  HadronFractions.k0l_logit:    {value: 0.0}

  # ---- TPE-sampled constants ----
  # k0s ECal fraction, windowed to (0.1, 0.5) by construction (K0S_FRAC_BOUNDS).
  # The gradient fits walked it to the ceiling (0.48 in R1, 0.95 pre-window),
  # draining the NH stream; the full window lets the study test whether that wall
  # was physics or an artifact of the missing count gradient.
  # NOTE 0.1 is a HARD floor: the sigmoid is affinely mapped into
  # K0S_FRAC_BOUNDS = (0.1, 0.5) (learnable.py), so the parameter physically
  # cannot represent a smaller fraction and `low: 0.0` makes this file fail to
  # load. To search below 0.1 you must widen K0S_FRAC_BOUNDS itself -- but do
  # that only on evidence from a run with a HEALTHY update count: the mee
  # restructure round drove k0s toward this floor (0.147-0.171 in its best
  # trials) while its fits were starved of ~10x their Adam updates by the
  # global-batch bug, so that pull is not yet trustworthy.
  HadronFractions.k0s_logit:    {low: 0.1, high: 0.5, init: 0.3}
  # photon ECal fraction (window 0.8-1.0). 1.0 = no leak; below it, (1-f) of each
  # photon's energy goes to HCal, which is the lever on the NH deficit at high E.
  # Floor 0.9: the A0 frozen-card scan showed f <= 0.93 pushing photon totals
  # under the 0.9 gate, so lower values are known-bad territory -- but the fit
  # adapts, and TPE can still rediscover "no leak" at the top of the range.
  # NOTE this is sampled TOGETHER with photon_merge_radius. Both cut photon yield,
  # so their optima are correlated -- but they are NOT degenerate: only the
  # fraction moves energy into the HCal/NH stream, and merging HARDENS the photon
  # spectrum (merged = sum of members) where a leak SOFTENS it. The per-pid shape
  # terms and the hcal_nh count term separate them. Read the fANOVA importances
  # printed at the end of the study before trusting a single best trial.
  HadronFractions.photon_logit: {low: 0.9, high: 1.0, init: 1.0}
