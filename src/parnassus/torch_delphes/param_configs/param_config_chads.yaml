# Charged-hadron calibration truth config (M3 of .claude/docs/muon_gun_lines_eta_split_plan.md):
# generation-side truth for --process ksgun (K_S -> pi+ pi-, one per event).
# Perturbations copied from param_config_all.yaml (comparable studies).
# Expected recovery (plan M3 table, updated after M0 T1): scale_raw[0,1] fast (SNR ~5), a_raw[0..2]
# and scale_raw[2] fine (~1.4), eff_logits[1,2,3] fast; b_raw[0..2] PARTIAL (weak lever from the K_S
# tail only; M0 T1 gave SNR 0.08 / 0.17 / 0.45 at batch 256 -- kept perturbed + trainable by user
# decision, M3 decides empirically); eff_logits[0] SLOW (0.1-1 GeV barrel pions
# mostly curl before r = 1.29 m -> few reconstructed tracks in that count bin). HCal / ECal /
# HadronFractions stay at the default and are NOT trainable in M3 (only K_S daughters in the sample).
# Chad efficiency now has 6 pt bins per |eta| side (barrel [0..5], endcap
# [6..11]); the legacy perturbed value is replicated across the above-1-GeV
# sub-bins, preserving the original flat perturbation.
