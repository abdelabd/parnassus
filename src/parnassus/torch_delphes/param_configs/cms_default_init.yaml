# Explicit CMS-default initialization config for tune_cms_fullsim.cli.
#
# The 68 card scalars at their CONSTRUCTOR DEFAULT values -- verified identical to
# param_config.card_default_config(CMSEnergyFlowDefault()), 0/68 differing -- with
# the trainable mask and learning rates of the optuna_search SEED TRIAL, so that
# a single Adam fit through this file reproduces
#   optuna_search --optuna-config optuna_config_all.yaml --n-trials 1
# exactly. That command runs no search: TPE needs 10 startup trials and the median
# pruner 5, so trial 0 is the enqueued seed trial and nothing else.
#
# LR CONVENTION -- READ THIS BEFORE CHANGING --lr.
#   Each parameter's effective Adam lr is `--lr * lr_scale` (param_config.select_trainable).
#   optuna_search materializes its configs with global_lr = 1, i.e. lr_scale holds
#   the ABSOLUTE lr. This file follows that convention, so it is directly
#   comparable with any round_<n>/materialized_config.yaml -- and it must be run
#   with `--lr 1.0`. Passing the old `--lr 1e-3` silently gives every parameter a
#   1000x smaller step.
#     resolution (a/b/c softplus coeffs) : 0.0049
#     scale      (tanh momentum/calo)    : 0.0019
#     efficiency (sigmoid effs + rate)   : 0.015
#   These are the calibrated `init:` values of optuna_config_all.yaml's search.lr.
#
# TRAINABLE MASK: 60 of 68 fitted. Frozen are the 5 HadronFractions logits (at the
# generation truth), the 2 muon rate_raw, and ECal.resolution_func.barrel_a -- the
# last pinned to break the exact ECal barrel/endcap sigma degeneracy. These are the
# 8 entries of optuna_config_all.yaml's `constants:` block.
#
# To reproduce the seed trial (single fit, no study):
#   srun python -m parnassus.torch_delphes.tune_cms_fullsim \
#       --root-file <sample.root> --n-events -1 --n-steps 200 \
#       --lr 1.0 --batch-size 2048 \
#       --param-config src/parnassus/torch_delphes/param_configs/cms_default_init.yaml \
#       --loss wasserstein_1d --pid-weighting sqrt_fraction \
#       --lr-scheduler-patience 0 --mode delphes \
#       --history-path <out.json>
#   (--pid-weighting and --lr-scheduler-patience differ from cli.py's own defaults,
#    which are 'equal' and 4; optuna_search uses 'sqrt_fraction' and 0.)

