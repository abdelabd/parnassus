# Electron calibration truth config (M2 of .claude/docs/muon_gun_lines_eta_split_plan.md):
# generation-side truth for --process electrongun (J/psi + Z -> e e, one per event).
# Perturbations copied from param_config_all.yaml (comparable studies).
# Expected recovery (plan M2 table, updated after M0 T1): eff_logits[1,4] fast, eff_logits[0,3]
# fine, eff_logits[2,5] (>100 GeV, ~5k electrons per 200k events) partial; a_raw[1] fine, a_raw[0,2]
# and scale_raw[0..2] SLOW (weak but real levers: the electron pair mass is only partly track-driven,
# so the signal is a few x smaller than for muons; the endcap categories are sparse).
# b_raw[0..2] perturbed + trainable "for completeness" (user decision 2026-08-18) but NOT expected
# to recover: b matters only where the ECal dominates the PF electron energy (track weight <~ 10 %
# above ~30 GeV), so it is calo-hidden -- a random walk in params_reg.pdf is the expected outcome.
# The ECal block is NOT trainable in M2 (isolate the electron track/eff parameters; M2b optional).
