# Meta hyperparameter search space for gebo_optuna_search.py.
#
# This scans the GEBO / L-BFGS *run settings* (data size, loss weights, GP
# priors, trust-region schedule knobs) -- NOT the 66 physical detector
# parameters, whose bounds still come from a separate --optuna-config
# (default param_configs/optuna_config.yaml), shared unchanged across every
# trial of every scan.
#
# Format: {low, high, log} for a sampled float/int range (log: true samples
# on a log scale and requires low > 0; add `type: int` for an integer
# parameter), or {choices: [...]} for a categorical. Mirrors the
# param_configs/optuna_config.yaml `search:` block convention.
#
# Sections:
#   common:        sampled for every scan, regardless of --loss/--grad-mode.
#                   gp.max_train_points is only used by grad ("no_grad: false")
#                   scans; gp.max_train_points_no_grad only by no_grad scans.
#                   gebo_optuna_search.py samples only the one that matters for
#                   a given --grad-mode and pins the other at gebo_search.py's
#                   own default (80 / 500) so it never wastes search budget.
#   trust_region:  one sub-block per --trust-region choice. "none"
#                   (NoTrustRegion) takes no constructor args, so it is empty.

common:
  n_events:    {low: 1000, high: 10000, log: true, type: int}
  n_initial:   {low: 5, high: 40, log: true, type: int}
  batch_size:  {low: 64, high: 1024, log: true, type: int}

  loss_weights:
    count_weight:      {low: 0.1, high: 2.0, log: true}
    calo_count_weight: {low: 0.1, high: 2.0, log: true}
    event_weight:      {low: 0.1, high: 2.0, log: true}
    count_rate_floor:  {low: 0.0, high: 2.0, log: false}
    pid_weighting:     {choices: [equal, fraction, sqrt_fraction]}
    pid_weight_floor:  {low: 0.0, high: 2.0, log: false}

  gp:
    max_train_points:          {low: 40, high: 120, log: true, type: int}
    max_train_points_no_grad:  {low: 40, high: 1000, log: true, type: int}
    # RBF lengthscale / outputscale GammaPrior(concentration, rate); each
    # component sampled independently on [0.1, 10.0].
    lengthscale_prior_concentration: {low: 0.1, high: 10.0, log: true}
    lengthscale_prior_rate:          {low: 0.1, high: 10.0, log: true}
    outputscale_prior_concentration: {low: 0.1, high: 10.0, log: true}
    outputscale_prior_rate:          {low: 0.1, high: 10.0, log: true}
    noise_floor:            {low: 1.0e-3, high: 0.9, log: true}
    init_lengthscale_frac:  {low: 0.1, high: 10.0, log: true}

trust_region:
  cosine:
    radius_min_frac: {low: 0.001, high: 1.0, log: true}
    t0:              {low: 5, high: 50, log: true, type: int}
  adaptive:
    radius_min_frac: {low: 0.001, high: 1.0, log: true}
    patience:        {low: 5, high: 50, log: true, type: int}
  none: {}
