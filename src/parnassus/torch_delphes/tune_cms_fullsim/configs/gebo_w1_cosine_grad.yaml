# GEBO run config: Wasserstein-1D loss, cosine trust-region schedule,
# gradient-enhanced GP (RBFKernelGrad).
#
# Reproduces the command:
#   python -m parnassus.torch_delphes.tune_cms_fullsim.gebo_search \
#     --root-file /global/cfs/cdirs/m3246/diff_delphes/cms_pseudodata_100k.root \
#     --n-events 2000 --n-iterations 1000 --n-initial 10 --batch-size 256 \
#     --loss wasserstein_1d --output-dir doc/figures/gebo_w1_cosine --acq LogEI \
#     --machine-debug --tr-schedule cosine --plot-every-best
#
# Run with:
#   python -m parnassus.torch_delphes.tune_cms_fullsim.gebo_search \
#     src/parnassus/torch_delphes/tune_cms_fullsim/configs/gebo_w1_cosine_grad.yaml
#
# Any key omitted below falls back to its default (see _GEBO_CONFIG_DEFAULTS in
# gebo_search.py). Keys accept hyphens or underscores (n-events == n_events).

# --- Data / run size ---
root_file: /global/cfs/cdirs/m3246/diff_delphes/cms_pseudodata_100k.root
n_events: 2000
n_iterations: 1000
n_initial: 10
batch_size: 256
seed: 0

# --- Objective ---
loss: wasserstein_1d          # deterministic, bin-free; see LOSS_CHOICES
acq: LogEI                    # EI | LogEI | qLNEI

# --- Trust region (cosine annealing with warm restarts) ---
tr_schedule: cosine           # cosine | adaptive | none
# tr_radius_min_frac: 0.01
# tr_t0: null                 # null -> n_iterations // 4
# tr_patience: 15             # adaptive schedule only

# --- GP mode ---
no_grad: false                # false -> gradient-enhanced GP (RBFKernelGrad)

# --- Output / logging ---
output_dir: doc/figures/gebo_w1_cosine_randomdrop
machine_debug: true           # write per-iteration gebo_debug.yaml
comet_disabled: false

# --- Intermediate validation plots ---
plot_every_best: true
n_plot_events: 20000
plot_batch_size: 2000
truth_config: src/parnassus/torch_delphes/param_configs/cms_target_default.yaml

# --- Parameter bounds / search space ---
# optuna_config: null         # null -> packaged param_configs/optuna_config.yaml
# param_config: null          # optional per-dim TR lr_scale source

# --- Loss-weight knobs (defaults shown; uncomment to override) ---
# count_weight: 0.1
# calo_count_weight: 1.0
# count_rate_floor: 0.05
# event_weight: 0.1
# pid_weighting: sqrt_fraction
# pid_weight_floor: 0.0
